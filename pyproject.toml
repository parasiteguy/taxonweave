[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TaxonWeave"
version = "0.2.1"
description = "Provenance-aware reconciliation of taxonomic concepts and molecular sequence records."
readme = "README.md"
requires-python = ">=3.9"

authors = [
    {name = "Andrew Davinack"}
]

dependencies = [
    "biopython>=1.81",
    "pandas>=2.0",
    "requests>=2.31"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taxonweave*"]

[project.scripts]
taxonweave = "taxonweave.cli:main"